<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetalTech - Esteira em RA</title>

    <!-- Biblioteca A-Frame: criação da cena 3D -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Biblioteca MindAR: reconhecimento e rastreamento da imagem -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; font-family: Arial, sans-serif; }

        /* Faixa de status no topo da tela */
        #status {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            padding: 8px; text-align: center; font-size: 14px;
            background: rgba(0, 0, 0, 0.7); color: #fff;
        }
    </style>
</head>

<body>

    <div id="status">Aponte a câmera para o marcador da esteira</div>

    <a-scene
        mindar-image="imageTargetSrc: ./assets/marcador.mind; uiScanning: no"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Câmera do dispositivo -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Tudo aqui dentro aparece em cima do marcador -->
        <a-entity id="alvo" mindar-image-target="targetIndex: 0">

            <!-- Painel com as contagens -->
            <a-plane position="-0.18 0 0.01" width="0.6" height="0.62" color="#0B0B0B" opacity="0.95"></a-plane>
            <!-- Faixa azul no topo do painel (identidade visual MetalTech) -->
            <a-plane position="-0.18 0.295 0.015" width="0.6" height="0.03" color="#2952CC"></a-plane>

            <a-text value="ESTEIRA DE TRIAGEM" position="-0.45 0.24 0.02" width="1.1" color="#FFFFFF"></a-text>

            <a-text value="Metalicas:" position="-0.45 0.12 0.02" width="1" color="#BFBFBF"></a-text>
            <a-text id="txt-metalicas" value="--" position="0.0 0.12 0.02" width="1.4" color="#FFFFFF"></a-text>

            <a-text value="Nao metalicas:" position="-0.45 0.02 0.02" width="1" color="#BFBFBF"></a-text>
            <a-text id="txt-nao-metalicas" value="--" position="0.0 0.02 0.02" width="1.4" color="#FFFFFF"></a-text>

            <a-text value="Total:" position="-0.45 -0.08 0.02" width="1" color="#BFBFBF"></a-text>
            <a-text id="txt-total" value="--" position="0.0 -0.08 0.02" width="1.4" color="#FFFFFF"></a-text>

            <a-text id="txt-nivel" value="Reservatorio: --" position="-0.45 -0.18 0.02" width="1" color="#FFFFFF"></a-text>
            <a-text id="txt-alerta" value="" position="-0.45 -0.26 0.02" width="0.9" color="#FFFFFF"></a-text>

            <!-- Reservatório: tubo transparente + "conteúdo" que sobe conforme o nível -->
            <a-cylinder position="0.32 0 0.15" radius="0.08" height="0.5"
                        color="#FFFFFF" opacity="0.25"></a-cylinder>
            <a-cylinder id="conteudo" position="0.32 -0.25 0.15" radius="0.075" height="0.01"
                        color="#8C8C8C"></a-cylinder>
        </a-entity>

    </a-scene>

    <script src="./app.js"></script>
</body>
</html>
