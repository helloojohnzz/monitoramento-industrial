spring.application.name=monitoramento-industrial

# ---------------------------------------------------------------
# Banco de dados
# Os valores vêm de variáveis de ambiente (nuvem / Docker).
# O valor depois dos ":" é o padrão usado só no desenvolvimento local.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/db_industrial_monitoring?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123456}

spring.jpa.hibernate.ddl-auto=update

# Porta da API (provedores de nuvem costumam definir a variável PORT)
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Segurança
# API_KEY: chave exigida para gravar dados (POST/PUT/DELETE).
#          Vazia = sem exigência (desenvolvimento local).
# CORS_ALLOWED_ORIGINS: sites que podem chamar a API pelo navegador,
#          separados por vírgula. "*" libera todos.
# ---------------------------------------------------------------
app.security.api-key=${API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---------------------------------------------------------------
# Monitoramento: expõe só GET /actuator/health (usado pelo provedor
# de nuvem e pelo Docker para saber se a API está no ar)
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
